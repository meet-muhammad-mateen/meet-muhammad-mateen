name: Generate Snake Contribution Animation

on:
  # Schedule: runs daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manual triggering at any time from GitHub Actions UI
  workflow_dispatch:

  # Run on every push to main branch
  push:
    branches:
      - main

# Grant GITHUB_TOKEN write permissions to commit generated SVG files to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
